spring.application.name=core-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/core_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Mexico_City
spring.datasource.username=barpro
spring.datasource.password=barpro
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info

# Notificaciones: se llama directo a notification-service (fuera del gateway)
app.notifications.url=http://localhost:8083/api/notifications
app.public-url=http://localhost:4200
app.admin-email=admin@velvet.mx

# Subida de imagenes (fotos de cocteles)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads

# Token compartido con el gateway (sin el, X-User-* se ignora)
app.internal.token=${INTERNAL_TOKEN}
