spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Mexico_City
spring.datasource.username=barpro
spring.datasource.password=barpro
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

app.jwt.secret=${JWT_SECRET}

# Password del admin seed (solo la primera ejecucion sobre BD vacia).
# Obligatoria en produccion: si no se define, se usa la de desarrollo.
app.admin.password=${ADMIN_PASSWORD:admin123}
app.jwt.ttl-minutes=1440

management.endpoints.web.exposure.include=health,info

eureka.instance.hostname=localhost
